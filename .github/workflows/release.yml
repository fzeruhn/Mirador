name: Release

# A v* tag builds Mirador's installer and makes a draft release with it (Mirador.md §4.11 item 54). The installer has
# no Monado, no OpenComposite and no gaze_world: each profile gets its Monado from Mirador (§4.11 item 55), Home offers
# "Get OpenComposite" (item 56), and "Check my calibration" is hidden. Unsigned until §10.2 is settled.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build and test
        shell: pwsh
        run: tools\build.ps1 -Test -SkipHardware

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
              choco install innosetup -y --no-progress
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: The bundle and the installer
        shell: pwsh
        run: |
          tools\build-bundle.ps1
          tools\build-installer.ps1

      - name: The draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The tag must name the version the app was built with (Directory.Build.props), so the installer's name and
          # the release agree.
          $version = $env:TAG.Substring(1)
          $installer = "artifacts\Mirador-$version-setup.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
              $built = (Get-ChildItem artifacts -Filter 'Mirador-*-setup.exe').Name -join ', '
              throw "The tag $env:TAG doesn't match the version built ($built): set <Version> in Directory.Build.props."
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          $notes = "Unsigned. SHA-256 of the installer: $hash"
          gh release create $env:TAG $installer --draft --verify-tag --title "Mirador $version" --notes $notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the installer
        uses: actions/upload-artifact@v5
        with:
          name: installer-${{ github.sha }}
          if-no-files-found: error
          path: artifacts/Mirador-*-setup.exe
