name: Installer

# Builds Mirador's installer on every push, so a broken installer shows before a release; a v* tag also makes a draft
# release with it (Mirador.md §4.11 item 54). The tests run in build.yml, for tags too. The installer has
# no Monado, no OpenComposite and no gaze_world: each profile gets its Monado from Mirador (§4.11 item 55), Home offers
# "Get OpenComposite" (item 56), and "Check my calibration" is hidden. Unsigned until §10.2 is settled.

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
              choco install innosetup -y --no-progress
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: The bundle and the installer
        shell: pwsh
        run: |
          tools\build-bundle.ps1
          tools\build-installer.ps1

      - name: Upload the installer
        uses: actions/upload-artifact@v5
        with:
          name: installer
          if-no-files-found: error
          path: artifacts/Mirador-*-setup.exe

  # Only a v* tag gets write access, and only here.
  release:
    needs: installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: installer

      - name: The draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # The tag must name the version the app was built with (<Version> in Directory.Build.props), so the
          # installer's name and the release agree.
          version="${TAG#v}"
          installer="Mirador-$version-setup.exe"
          if [ ! -f "$installer" ]; then
            echo "The tag $TAG doesn't match the version built ($(ls Mirador-*-setup.exe)): set <Version> in Directory.Build.props." >&2
            exit 1
          fi
          hash=$(sha256sum "$installer" | cut -d' ' -f1)
          gh release create "$TAG" "$installer" --draft --verify-tag --title "Mirador $version" \
            --notes "Unsigned. SHA-256 of the installer: $hash"
