name: Build

# Builds and tests Mirador on every push and pull request: the stand-in and the direct-mode layer (MSVC, the layer's
# Catch2 tests too), the app, the helper and the tests.
# Tests that need the headset, Bluetooth or this machine set up skip themselves (their Fact attributes), and those
# marked Category=Hardware are left out here.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      - name: Build and test
        shell: pwsh
        run: tools\build.ps1 -Test -SkipHardware

      - name: Upload the app, helper and stand-in
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: mirador-${{ github.sha }}
          if-no-files-found: error
          path: |
            src/Mirador.App/bin/x64/Release/
            src/Mirador.Helper/bin/x64/Release/
            artifacts/standin/monado-service.exe
            artifacts/layer-build/layer/mirador_direct_mode.json
            artifacts/layer-build/layer/mirador_direct_mode.dll
            artifacts/layer-build/check/mirador-display-check.exe
            artifacts/xr-check-build/xr-check.exe

      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: test-results-${{ github.sha }}
          path: '**/TestResults/*.trx'
